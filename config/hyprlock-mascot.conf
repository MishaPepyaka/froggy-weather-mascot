# Paste these blocks into ~/.config/hypr/hyprlock.conf.
# Position and size may be adjusted to fit your lock-screen layout.

image {
    monitor =
    path = ~/.cache/lock-weather/mascot.png
    size = 280
    reload_time = 1
    onclick = ~/.local/bin/lock-weather-toggle-variant
    rounding = 24
    border_size = 0
    position = -150, -420
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:900000] ~/.local/bin/lock-weather-winnipeg morning
    color = rgba(205, 214, 244, 0.96)
    font_size = 19
    font_family = JetBrains Mono
    position = 150, -340
    halign = center
    valign = center
    text_align = center
}

label {
    monitor =
    text = cmd[update:900000] ~/.local/bin/lock-weather-winnipeg day
    color = rgba(148, 226, 213, 0.96)
    font_size = 19
    font_family = JetBrains Mono
    position = 150, -430
    halign = center
    valign = center
    text_align = center
}

label {
    monitor =
    text = cmd[update:900000] ~/.local/bin/lock-weather-winnipeg evening
    color = rgba(203, 166, 247, 0.96)
    font_size = 19
    font_family = JetBrains Mono
    position = 150, -520
    halign = center
    valign = center
    text_align = center
}
